<div
  class="min-h-screen w-full bg-cover bg-center bg-no-repeat flex flex-row flex-wrap justify-center items-center gap-6 p-6"
  style="background-image: url('https://brandemia.org/sites/default/files/inline/images/cinepolis_logo_antes.jpg');"
>

<div class="flex flex-row flex-wrap justify-center items-start gap-6 w-full p-6">
<div class="w-full max-w-sm bg-white p-6 border-2 border-gray-500 rounded-xl shadow-lg">
    <form [formGroup]="formulario">
        <h5 class="text-xl font-semibold text-heading mb-6">ENTRADAS</h5>
        <div class="mb-4">
            <label for="nombre" class="block mb-2.5 text-sm font-medium text-heading">Nombre</label>
            <input formControlName="nombre" type="text" id="nombre" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="Escribe tu nombre" required />
        </div>
        <div class="mb-4">
            <label for="compradores" class="block mb-2.5 text-sm font-medium text-heading">Cantidad compradores</label>
            <input formControlName="compradores" type="number" id="compradores" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="0" required />
        </div>
         <div class="mb-4">
            <label for="compradores" class="block mb-2.5 text-sm font-medium text-heading">Tarjeta CINECO</label>
           <label>Si<input formControlName="tarjeta" type="radio" value="si" id="si" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" required /></label>
        <label>No<input formControlName="tarjeta" type="radio" value="no" id="no" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" required /></label>
        </div>
        <div class="mb-4">
            <label for="boletos" class="block mb-2.5 text-sm font-medium text-heading">Cantidad Boletos</label>
            <input formControlName="boletos" type="number" id="boletos" class="bg-neutral-secondary-medium border border-default-medium text-heading text-sm rounded-base focus:ring-brand focus:border-brand block w-full px-3 py-2.5 shadow-xs placeholder:text-body" placeholder="0" required />
        </div>
        
       <button type="submit" (click)="Procesar()" class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none w-full mb-3">Procesar</button>
         <button type="submit" (click)="Salir()" class="text-white bg-brand box-border border border-transparent hover:bg-brand-strong focus:ring-4 focus:ring-brand-medium shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none w-full mb-3">Salir</button>
         </form>

         
   
</div>



<div class="w-full max-w-sm bg-white p-6 border-2 border-gray-500 rounded-xl shadow-lg">
        <h5 class="text-xl font-semibold text-heading mb-6">Salidas</h5>
        <div class="mb-4">
             <label for="total" class="block mb-2.5 text-sm font-medium text-heading">Nombre del comprador: {{nombre}}</label>
            <label for="total" class="block mb-2.5 text-sm font-medium text-heading">Cantidad a pagar: ${{ total.toFixed(2) }}</label>
           <p class="font-semibold text-blue-700 mb-5">{{ mensaje }}</p>

        </div>
</div>
</div>

</div>
